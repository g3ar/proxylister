# Proxy Tools runtime configuration.
#
# Use one KEY=value assignment per line. Empty lines and comments beginning
# with # are ignored. CLI options override the corresponding values for one
# invocation. Durations are seconds unless a comment says otherwise.

# Maximum duration of one network request. Must be greater than zero.
TIMEOUT=5

# Concurrent network checks. Allowed range: 1-100.
WORKERS=50

# Requests used for one latency measurement; the median is recorded. Range: 1-5.
SAMPLES=1

# Maximum acceptable median latency in milliseconds.
MAX_LATENCY=500

# Optional target URL checked through every proxy. Empty disables this check.
URL=

# Delay between monitor active-pool passes.
MONITOR_REFRESH_INTERVAL=10

# Recent measurements retained for each proxy.
MONITOR_HISTORY_SIZE=10

# Measurements required for initial STABLE admission.
MONITOR_MIN_CHECKS=5

# Required successful fraction in rolling history. Range: 0-1.
MONITOR_MIN_SUCCESS_RATE=0.8

# Consecutive successes required for initial STABLE admission.
MONITOR_MIN_SUCCESS_STREAK=3

# Continuous uptime required for initial STABLE admission.
MONITOR_MIN_ALIVE_TIME=60

# Maximum permitted latency deviation in milliseconds.
MONITOR_MAX_JITTER=500

# Consecutive hard failures tolerated while retaining STABLE.
MONITOR_ALIVE_FAILURE_TOLERANCE=2

# Continuous failed duration before PROBATION becomes DEGRADED.
MONITOR_DEGRADED_AFTER=60

# Continue tracking proxies absent from ProxyScrape for this duration.
MONITOR_RETENTION_TIME=1800

# Browser used by the monitor's interactive b action: auto, chrome or firefox.
MONITOR_BROWSER=auto
