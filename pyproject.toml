[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxytools"
dynamic = ["version"]
description = "CLI tools for discovering and monitoring public proxies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["maxminddb>=2.6", "portalocker>=4.1", "requests[socks]", "selenium>=4.10", "rich>=14", "textual>=1.0"]

[project.scripts]
proxytools = "proxytools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "proxytools.__version__"}
